name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:

jobs:
  build-and-publish:
    if: github.repository_owner == 'PIH'
    concurrency:
      group: build-and-deploy-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/build-and-deploy-to-openmrs-jfrog.yml@main
    with:
      image_name: partnersinhealth/pihsl-emr
      maven_profiles: distro-zip
      notify_ci_dashboard: true
    secrets: inherit

  smoke-tests:
    if: github.repository_owner == 'PIH'
    needs: build-and-publish
    concurrency:
      group: smoke-tests-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/smoke-tests.yml
    secrets: inherit

  deploy-to-kgh-test:
    if: github.repository_owner == 'PIH'
    needs: build-and-publish
    concurrency:
      group: deploy-to-kgh-test-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/deploy-via-runner.yml@main
    with:
      runner-label: kgh-test
      notify_ci_dashboard: true
    secrets: inherit

  deploy-to-gladi:
    if: github.repository_owner == 'PIH'
    needs: build-and-publish
    concurrency:
      group: deploy-to-gladi-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/deploy-via-runner.yml@main
    with:
      runner-label: gladi
      notify_ci_dashboard: true
    secrets: inherit
